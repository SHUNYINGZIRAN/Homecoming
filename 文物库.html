<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com">
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@400;600&display=swap');

        html,
        body {
            height: 100%;
            margin: 0;
            overflow-y: scroll;
            /* 始终显示滚动条 */
            scrollbar-gutter: stable;
        }

        body {
            font-family: 'Inter', 'Noto Serif SC', serif;
            background-color: #0b0d0f;
            color: #e5e3db;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: scroll;
            /* 始终显示滚动条 */
        }

        /* 隐藏页面滚动条但保留滚动功能 */
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
        }

        html {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .serif {
            font-family: 'Noto Serif SC', serif;
        }

        .text-gold {
            color: #b8963c;
        }

        .bg-gold {
            background-color: #b8963c;
        }

        .border-gold {
            border-color: #b8963c;
        }

        .hover-gold:hover {
            color: #b8963c;
        }

        /* 搜索框样式 */
        .search-input {
            background: #1a1c20;
            border: 1px solid #333;
            color: #e5e3db;
            transition: all 0.25s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #b8963c;
            box-shadow: 0 0 0 3px rgba(184, 150, 60, 0.08);
        }

        .search-input::placeholder {
            color: #666;
        }

        /* 筛选标签 */
        .filter-chip {
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
        }

        .filter-chip.active {
            background-color: #b8963c;
            color: #0b0d0f;
            border-color: #b8963c;
            font-weight: 600;
        }

        /* 筛选按钮样式 */
        .filter-btn {
            transition: all 0.25s ease;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: #b8963c;
            color: #e5e3db;
        }

        .filter-btn.active-filter {
            background-color: #b8963c;
            color: #0b0d0f;
            border-color: #b8963c;
            font-weight: 600;
        }

        /* 卡片入场动画 */
        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(24px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片样式 */
        .artifact-card {
            background: #111317;
            border: 1px solid #1e2025;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            animation: cardEntrance 0.5s ease forwards;
        }

        .artifact-card:hover {
            transform: translateY(-6px);
            border-color: #b8963c44;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(184, 150, 60, 0.15) inset;
        }

        .artifact-card:active {
            transform: translateY(-2px);
            transition: all 0.1s ease;
        }

        .artifact-card .card-image {
            height: 180px;
            background: #1a1c20;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .artifact-card .card-image .icon-placeholder {
            font-size: 3rem;
            color: #333;
            transition: color 0.3s ease;
        }

        .artifact-card:hover .card-image .icon-placeholder {
            color: #b8963c;
        }

        .artifact-card .card-image .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            backdrop-filter: blur(6px);
        }

        .badge-returned {
            background: #1e3a2fcc;
            color: #6fcf97;
            border: 1px solid #2a5a3e;
        }

        .badge-disputed {
            background: #3d3a1acc;
            color: #f2c94c;
            border: 1px solid #5a5428;
        }

        .badge-unclaimed {
            background: #3a1e1ecc;
            color: #eb5757;
            border: 1px solid #5a2a2a;
        }

        .badge-returned-solid {
            background: #1e3a2f;
            color: #6fcf97;
        }

        .badge-disputed-solid {
            background: #3d3a1a;
            color: #f2c94c;
        }

        .badge-unclaimed-solid {
            background: #3a1e1e;
            color: #eb5757;
        }

        /* 响应式网格 */
        .artifact-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1rem;
        }

        @media (min-width: 540px) {
            .artifact-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
        }

        @media (min-width: 900px) {
            .artifact-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.25rem;
            }
        }

        @media (min-width: 1200px) {
            .artifact-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 1.5rem;
            }
        }

        /* 无滚动条 */
        body {
            overflow-x: hidden;
        }
    </style>
</head>

        }, {

            event: '殖民时期掠夺',
            status: 'disputed',
            description: '吴哥王朝鼎盛时期的石雕作品，体现高棉帝国的宗教艺术。柬埔寨近年成功追回多件类似文物。',
            imageIcon: 'fa-ankh'
        }];

        // ---------- 筛选与排序 ----------
        let currentStatusFilter = 'all';
        let currentCategoryFilter = 'all';
        let currentSearchTerm = '';
        let currentSort = 'default';

        function getFilteredArtifacts() {
            let filtered = artifacts.filter(a => {
                const statusMatch = currentStatusFilter === 'all' || a.status === currentStatusFilter;
                if (!statusMatch) return false;
                const categoryMatch = currentCategoryFilter === 'all' || a.category === currentCategoryFilter;
                if (!categoryMatch) return false;
                if (!currentSearchTerm.trim()) return true;
                const term = currentSearchTerm.trim().toLowerCase();
                return (
                    a.name.toLowerCase().includes(term) ||
                    a.originName.toLowerCase().includes(term) ||
                    a.currentName.toLowerCase().includes(term) ||
                    a.event.toLowerCase().includes(term) ||
                    a.description.toLowerCase().includes(term) ||
                    (a.category && a.category.toLowerCase().includes(term)) ||
                    (a.era && a.era.toLowerCase().includes(term))
                );
            });

            // 排序
            if (currentSort === 'name-asc') {
                filtered.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
            } else if (currentSort === 'name-desc') {
                filtered.sort((a, b) => b.name.localeCompare(a.name, 'zh'));
            } else if (currentSort === 'era-asc') {
                filtered.sort((a, b) => (a.eraYear || 0) - (b.eraYear || 0));
            } else if (currentSort === 'era-desc') {
                filtered.sort((a, b) => (b.eraYear || 0) - (a.eraYear || 0));
            }

            return filtered;
        }

        // ---------- DOM引用 ----------
        const gridContainer = document.getElementById('artifact-grid');
        const emptyState = document.getElementById('empty-state');
        const resultCount = document.getElementById('result-count');
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const sortSelect = document.getElementById('sort-select');
        const statTotal = document.getElementById('stat-total');
        const statReturned = document.getElementById('stat-returned');
        const statDisputed = document.getElementById('stat-disputed');
        const statUnclaimed = document.getElementById('stat-unclaimed');

        // ---------- 工具函数 ----------
        function getStatusLabel(status) {
            if (status === 'returned') return '已归国';
            if (status === 'disputed') return '争议中';
            return '未申索';
        }

        function getStatusBadgeClass(status) {
            if (status === 'returned') return 'badge-returned';
            if (status === 'disputed') return 'badge-disputed';
            return 'badge-unclaimed';
        }

        function getStatusBadgeSolidClass(status) {
            if (status === 'returned') return 'badge-returned-solid';
            if (status === 'disputed') return 'badge-disputed-solid';
            return 'badge-unclaimed-solid';
        }

        function getCategoryLabel(cat) {
            return cat || '其他';
        }

        // ---------- 渲染函数 ----------
        function updateStats(filtered) {
            statTotal.textContent = filtered.length;
            statReturned.textContent = filtered.filter(a => a.status === 'returned').length;
            statDisputed.textContent = filtered.filter(a => a.status === 'disputed').length;
            statUnclaimed.textContent = filtered.filter(a => a.status === 'unclaimed').length;
            resultCount.textContent = `共 ${filtered.length} 件文物`;
        }

        function renderCards() {
            const filtered = getFilteredArtifacts();
            gridContainer.innerHTML = '';
            updateStats(filtered);

            if (filtered.length === 0) {
                gridContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach((a, index) => {
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.style.animationDelay = `${index * 0.04}s`;
                    card.innerHTML = `
                <div class="card-image">
                  <i class="fas ${a.imageIcon || 'fa-archive'} icon-placeholder"></i>
                  <span class="status-badge ${getStatusBadgeClass(a.status)}">${getStatusLabel(a.status)}</span>
                </div>
                <div class="p-4 flex-1 flex flex-col">
                  <h3 class="font-bold text-sm serif leading-tight mb-1 line-clamp-2">${a.name}</h3>
                  <p class="text-xs text-gray-500 mb-2">${a.era} · ${a.material} · ${getCategoryLabel(a.category)}</p>
                  <p class="text-xs text-gray-400 mt-auto flex items-center gap-1">
                    <i class="fas fa-map-marker-alt text-gold text-xs"></i> ${a.originName.split(' ').pop()}
                    <i class="fas fa-arrow-right text-gray-600 mx-1 text-[10px]"></i>
                    <span class="truncate">${a.currentName.split(' ').pop()}</span>
                  </p>
                </div>
              `;
                    card.style.cursor = 'pointer';
                    card.addEventListener('click', () => {
                        window.location.href = `文物详情.html?id=${a.id}`;
                    });
                    gridContainer.appendChild(card);
                });
            }
        }

        // ---------- 事件绑定 ----------
        searchInput.addEventListener('input', function (e) {
            currentSearchTerm = e.target.value;
            clearSearchBtn.classList.toggle('hidden', currentSearchTerm === '');
            renderCards();
        });

        clearSearchBtn.addEventListener('click', function () {
            searchInput.value = '';
            currentSearchTerm = '';
            clearSearchBtn.classList.add('hidden');
            renderCards();
            searchInput.focus();
        });

        sortSelect.addEventListener('change', function () {
            currentSort = this.value;
            renderCards();
        });

        // 分类筛选
        document.querySelectorAll('#category-filters .filter-btn').forEach(chip => {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#category-filters .filter-btn').forEach(c => c.classList
                    .remove('active-filter'));
                this.classList.add('active-filter');
                currentCategoryFilter = this.dataset.category;
                renderCards();
            });
        });

        // 状态筛选
        document.querySelectorAll('#status-filters .filter-btn').forEach(chip => {
            chip.addEventListener('click', function () {
                document.querySelectorAll('#status-filters .filter-btn').forEach(c => c.classList
                    .remove('active-filter'));
                this.classList.add('active-filter');
                currentStatusFilter = this.dataset.filter;
                renderCards();
            });
        });

        // 移动端菜单切换
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // ---------- 初始化 ----------
        function init() {
            // 默认选中状态
            document.querySelector('#category-filters .filter-btn[data-category="all"]').classList.add('active-filter');
            document.querySelector('#status-filters .filter-btn[data-filter="all"]').classList.add('active-filter');
            // 初始渲染
            renderCards();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
